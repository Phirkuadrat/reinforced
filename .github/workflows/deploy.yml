name: Deploy FastAPI to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          echo "🔍 Preparing SSH connection..."
          CLEAN_HOST=$(echo "$SSH_HOST" | sed -e 's|^[a-zA-Z]*://||' -e 's|/.*||' | tr -d ' \r\n')
          CLEAN_USER=$(echo "$SSH_USER" | tr -d ' \r\n')

          if [ -z "$CLEAN_HOST" ]; then echo "❌ SSH_HOST is empty!"; exit 1; fi
          if [ -z "$CLEAN_USER" ]; then echo "❌ SSH_USER is empty!"; exit 1; fi
          if [ -z "$SSH_KEY" ]; then echo "❌ SSH_KEY is empty!"; exit 1; fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps

          echo "🚀 Connecting to $CLEAN_USER@$CLEAN_HOST..."
          ssh -i ~/.ssh/id_vps -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$CLEAN_USER@$CLEAN_HOST" bash -s << 'EOF'
            set -e
            echo "✅ Connected to VPS successfully!"

            echo "📁 Entering project directory..."
            cd /var/www/reinforced

            # Hindari error dubious ownership dari git
            git config --global --add safe.directory /var/www/reinforced

            echo "📥 Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Updating python packages..."
            source venv/bin/activate
            pip install --no-cache-dir -r requirements.txt
            deactivate

            echo "🔒 Setting permissions..."
            chown -R www-data:www-data /var/www/reinforced
            chmod 775 /var/www/reinforced/database

            echo "🔄 Restarting FastAPI service..."
            systemctl restart reinforced

            echo "🎉 Deployment FastAPI selesai dengan sukses!"
          EOF
